[package]
name = "teams-linux-rs"
version = "0.1.0"
edition = "2024"
description = "Native GPU-rendered Teams client prototype for Linux"
license-file = "LICENSE"

[features]
libwebrtc-av = ["dep:teams-av"]
libwebrtc-test-support = ["libwebrtc-av", "teams-av/test-support"]

[dependencies]
base64 = "0.22.1"
arboard = { version = "3.6", default-features = false, features = ["image-data", "wayland-data-control"] }
chrono = "0.4"
futures = { version = "0.3", default-features = false, features = ["std"] }
futures-timer = "3"
png = "0.17"
dotenvy = "0.15.7"
encoding_rs = "0.8.42"
iced = { version = "0.14.0", default-features = false, features = ["wgpu", "x11", "wayland", "thread-pool", "svg", "image-without-codecs", "advanced", "lazy"] }
image-codec = { package = "image", version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
libc = "0.2"
libloading = "0.8.9"
hmac = "0.12"
sha1 = "0.10"
md5 = "0.8"
ost = { package = "teams-protocol", path = "vendor/ost", default-features = false }
rand = "0.8.5"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
scraper = { version = "0.24", default-features = false }
sha2 = "0.10.9"
teams-av = { path = "crates/teams-av", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util"] }
tokio-rustls = "0.24.1"
webpki-roots = "0.25.4"
ureq = { version = "3.5.0", features = ["json", "cookies"] }
url = "2.5.8"
urlencoding = "2.1.3"
unicode-segmentation = "1.13"
zbus = { version = "5.13.2", default-features = false, features = ["tokio"] }
webbrowser = "1.2.5"
wl-clipboard-rs = "0.9"

[dev-dependencies]
tiny_http = "0.12"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "=0.12.0", default-features = false, features = ["tokio"] }

[build-dependencies]
sha2 = "0.10.9"

[patch.crates-io]
webrtc-sys = { path = "vendor/webrtc-sys" }
